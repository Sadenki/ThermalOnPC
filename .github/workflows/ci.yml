# Tests à chaque push / pull request ; sur un tag vX.Y.Z, construit le .exe
# Windows et le paquet .deb puis les attache à une Release GitHub.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  windows:
    name: Windows .exe
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p flir-viewer
      - name: Renommer
        shell: bash
        run: |
          mkdir dist
          cp target/release/flir-viewer.exe "dist/flir-one-pc-${GITHUB_REF_NAME}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  deb:
    name: Paquet Debian
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    # Glibc de 22.04 (2.35) : le paquet s'installe aussi sur Debian 12 et Ubuntu 22.04+.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked --version 3.8.0
      - name: Vérifier que le tag correspond à la version de Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="flir-viewer") | .version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME ≠ version $version"; exit 1; }
      - run: cargo deb --locked -p flir-viewer --output dist/
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  release:
    name: Release GitHub
    needs: [windows, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
